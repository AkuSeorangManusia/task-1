- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install basic packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - vim
      - tar
      - gpg
    state: present

- name: Create node_exporter group
  ansible.builtin.group:
    name: "{{ common_node_exporter_group }}"
    system: true

- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ common_node_exporter_user }}"
    group: "{{ common_node_exporter_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Download node_exporter archive
  ansible.builtin.get_url:
    url: "{{ common_node_exporter_download_url }}"
    dest: "{{ common_node_exporter_archive_path }}"
    mode: '0644'

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: "{{ common_node_exporter_archive_path }}"
    dest: /tmp/
    remote_src: true
    creates: "{{ common_node_exporter_extract_dir }}"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ common_node_exporter_extract_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Create node_exporter service file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start(restart) node_exporter service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: restarted
