blackbox_exporter_user: "blackbox_exporter"
blackbox_exporter_group: "blackbox_exporter"
blackbox_exporter_archive_path: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64.tar.gz"
blackbox_exporter_extract_dir: "/tmp/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64"
