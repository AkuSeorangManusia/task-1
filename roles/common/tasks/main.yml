- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install basic packages
  apt:
    name:
      - curl
      - git
      - vim
      - tar
    state: present

- name: create node_exporter group
  group:
    name: "{{ node_exporter_group }}"
    system: yes

- name: create node_exporter user
  user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    shell: /usr/sbin/nologin
    system: yes
    create_home: no

- name: download node_exporter archive
  get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_archive_path }}"
    mode: '0644'

- name: extract node_exporter
  unarchive:
    src: "{{ node_exporter_archive_path }}"
    dest: /tmp/
    remote_src: yes
    creates: "{{ node_exporter_extract_dir }}"

- name: install node_exporter binary
  copy:
    src: "{{ node_exporter_extract_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: yes
    owner: root
    group: root
    mode: '0755'

- name: create node_exporter service file
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'

- name: reload systemd
  systemd:
    daemon_reload: yes

- name: enable and start(restart) node_exporter service
  systemd:
    name: node_exporter
    enabled: yes
    state: restarted
